name: Desktop Test Installers

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

concurrency:
  group: desktop-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: cashpatch-macos-test
          - os: windows-latest
            artifact: cashpatch-windows-test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Generate platform icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build unsigned test installer
        working-directory: desktop
        run: npm run desktop:build

      - name: Smoke-test macOS DMG
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} < 1 )); then
            echo "No DMG installer was produced" >&2
            exit 1
          fi

          dmg="${dmgs[0]}"
          echo "Verifying $dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          app_bundle="$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "DMG mounted, but no .app bundle was found" >&2
            exit 1
          fi

          info_plist="$app_bundle/Contents/Info.plist"
          plutil -lint "$info_plist"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$info_plist")"
          app_binary="$app_bundle/Contents/MacOS/$executable"
          test -x "$app_binary"
          file "$app_binary" | grep -q 'Mach-O'
          echo "DMG smoke test passed: $app_bundle contains executable $executable"

      - name: Smoke-test Windows EXE installer
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'No NSIS .exe installer was produced'
          }

          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Installer is not a valid Windows PE executable: $($installer.FullName)"
          }

          Write-Host "Installing $($installer.FullName) silently for smoke verification"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $uninstallRoots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'CashPatch' } |
            Select-Object -First 1

          if (-not $entry) {
            throw 'CashPatch installer returned success but no installed-app registration was found'
          }

          if (-not $entry.UninstallString) {
            throw 'CashPatch installed-app registration is missing its uninstaller'
          }

          Write-Host "Windows installer smoke test passed: $($entry.DisplayName) is registered"

          $uninstaller = $entry.UninstallString.Trim('"')
          if (Test-Path $uninstaller) {
            $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($remove.ExitCode -ne 0) {
              Write-Warning "Smoke-test cleanup uninstaller exited with code $($remove.ExitCode)"
            }
          }

      - name: Write installer checksums
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) -print0 |
            xargs -0 shasum -a 256 > src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Write installer checksums
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } |
            Set-Content 'src-tauri/target/release/bundle/SHA256SUMS.txt'

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
