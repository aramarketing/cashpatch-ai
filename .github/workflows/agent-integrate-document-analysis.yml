name: Agent Integrate Document Analysis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-integrate-document-analysis.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate local document signals into Full Scan
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("desktop/src-tauri/src/scan.rs")
          text = path.read_text()

          old = "collections::{BTreeMap, HashMap},"
          new = "collections::{BTreeMap, HashMap, HashSet},"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("scan.rs collection import anchor missing")

          old = '#[path = "scan_journal.rs"]\nmod scan_journal;\n'
          new = '#[path = "scan_journal.rs"]\nmod scan_journal;\n#[path = "document_analysis.rs"]\nmod document_analysis;\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'mod document_analysis;' not in text:
              raise SystemExit("scan journal module anchor missing")

          old = "    let mut duplicate_groups = BTreeMap::<String, u64>::new();\n    let mut findings = Vec::<LocalFinding>::new();\n"
          new = "    let mut duplicate_groups = BTreeMap::<String, u64>::new();\n    let mut invoice_numbers = HashMap::<String, (PathBuf, Option<String>)>::new();\n    let mut reported_invoice_numbers = HashSet::<String>::new();\n    let mut findings = Vec::<LocalFinding>::new();\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif 'let mut invoice_numbers' not in text:
              raise SystemExit("full scan accumulator anchor missing")

          anchor = "              if business_extension(path) && len > 0 && len <= CONTENT_HASH_MAX_BYTES {\n"
          insertion = '''              if business_extension(path) {
                if let Ok(Some(signals)) = document_analysis::analyze_document(path, len) {
                  if let Some(invoice) = signals.invoice {
                    if let Some((first_path, first_amount)) = invoice_numbers.get(&invoice.invoice_number) {
                      if first_path != path && reported_invoice_numbers.insert(invoice.invoice_number.clone()) {
                        let totals_differ = matches!(
                          (first_amount.as_deref(), invoice.amount.as_deref()),
                          (Some(first), Some(current)) if first != current
                        );
                        let amount_note = match (first_amount.as_deref(), invoice.amount.as_deref()) {
                          (Some(first), Some(current)) if first != current => {
                            format!(" The totals differ ({first} vs. {current}).")
                          }
                          (Some(amount), Some(_)) => format!(" Both documents show total {amount}."),
                          _ => String::new(),
                        };
                        let recurring_note = if invoice.recurring_hint {
                          " The document also contains recurring/subscription language."
                        } else {
                          ""
                        };

                        findings.push(LocalFinding {
                          id: Uuid::new_v4().to_string(),
                          category: "finance".to_string(),
                          severity: if totals_differ { "high" } else { "medium" }.to_string(),
                          title: "Duplicate invoice number detected".to_string(),
                          summary: format!(
                            "Two locally reviewed documents use invoice number {}.{}{}",
                            invoice.invoice_number, amount_note, recurring_note
                          ),
                          evidence: format!("{} :: {}", first_path.display(), path.display()),
                          remediation: "Compare both invoices and the corresponding payment records manually. Confirm whether this is a duplicate bill, a corrected invoice or an intentional copy before taking any action. CashPatch never pays, refunds, deletes or edits anything.".to_string(),
                        });
                      }
                    } else {
                      invoice_numbers.insert(
                        invoice.invoice_number.clone(),
                        (path.to_path_buf(), invoice.amount.clone()),
                      );
                    }
                  }
                }
              }

'''
          if 'document_analysis::analyze_document' not in text:
              if anchor not in text:
                  raise SystemExit("content hashing anchor missing")
              text = text.replace(anchor, insertion + anchor, 1)

          path.write_text(text)
          PY

      - name: Guard integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mod document_analysis;' desktop/src-tauri/src/scan.rs
          grep -q 'Duplicate invoice number detected' desktop/src-tauri/src/scan.rs
          grep -q 'document_analysis::analyze_document' desktop/src-tauri/src/scan.rs

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cashpatch-agent"
          git config user.email "cashpatch-agent@users.noreply.github.com"
          git add desktop/src-tauri/src/scan.rs
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "Integrate local duplicate-invoice analysis"
          git push origin HEAD:main
