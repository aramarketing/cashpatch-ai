name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Run desktop tests
        working-directory: desktop
        run: npm test
      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build
      - name: Generate platform icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Run native Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check Tauri backend
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
