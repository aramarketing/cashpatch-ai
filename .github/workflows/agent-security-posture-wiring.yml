name: One-shot security posture wiring

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-security-posture-wiring.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Wire security posture into native scan and dashboard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing marker: {label}")
              return text.replace(old, new, 1)

          lib_path = Path('desktop/src-tauri/src/lib.rs')
          lib = lib_path.read_text()
          if 'mod security_posture;' not in lib:
              lib = replace_once(lib, 'mod scan;\nmod vault;', 'mod scan;\nmod security_posture;\nmod vault;', 'lib module declaration')
          if 'security_posture::security_posture_scan,' not in lib:
              lib = replace_once(
                  lib,
                  '      inventory::vulnerability::vulnerability_scan,\n',
                  '      inventory::vulnerability::vulnerability_scan,\n      security_posture::security_posture_scan,\n',
                  'lib command registration',
              )
          lib_path.write_text(lib)

          scan_path = Path('desktop/src-tauri/src/scan.rs')
          scan = scan_path.read_text()
          if 'pub security_checks_seen: u64,' not in scan:
              scan = replace_once(
                  scan,
                  '  pub autostart_entries_seen: u64,\n  pub truncated: bool,',
                  '  pub autostart_entries_seen: u64,\n  pub security_checks_seen: u64,\n  pub truncated: bool,',
                  'quick plan security count field',
              )
          if 'let security_posture = crate::security_posture::collect_security_posture();' not in scan.split('pub fn full_scan_start', 1)[0]:
              scan = replace_once(
                  scan,
                  '    let inventory = crate::inventory::collect_system_inventory();\n\n    let estimated = estimate_full_seconds(files, bytes);',
                  '    let inventory = crate::inventory::collect_system_inventory();\n    let security_posture = crate::security_posture::collect_security_posture();\n\n    let estimated = estimate_full_seconds(files, bytes);',
                  'quick scan posture collection',
              )
          if 'security_checks_seen: security_posture.checks.len() as u64,' not in scan:
              scan = replace_once(
                  scan,
                  '      autostart_entries_seen: inventory.autostart_entries.len() as u64,\n      truncated,',
                  '      autostart_entries_seen: inventory.autostart_entries.len() as u64,\n      security_checks_seen: security_posture.checks.len() as u64,\n      truncated,',
                  'quick plan posture count assignment',
              )
          posture_findings = '''    let security_posture = crate::security_posture::collect_security_posture();
    for posture in security_posture.checks.into_iter().filter(|item| item.status == "warning") {
      findings.push(LocalFinding {
        id: Uuid::new_v4().to_string(),
        category: format!("security_posture:{}", posture.category),
        severity: posture.severity,
        title: posture.title,
        summary: posture.summary,
        evidence: posture.evidence,
        remediation: posture.remediation,
      });
    }

'''
          full_tail = scan.split('pub fn full_scan_start', 1)[1]
          if 'security_posture.checks.into_iter().filter' not in full_tail:
              scan = replace_once(scan, '    if denied > 0 {\n', posture_findings + '    if denied > 0 {\n', 'full scan posture findings')
          scan_path.write_text(scan)

          app_path = Path('desktop/src/App.tsx')
          app = app_path.read_text()
          if 'securityChecksSeen: number' not in app:
              app = replace_once(
                  app,
                  '  autostartEntriesSeen: number\n  truncated: boolean',
                  '  autostartEntriesSeen: number\n  securityChecksSeen: number\n  truncated: boolean',
                  'App quick plan posture count',
              )
          if 'type SecurityPostureCheck = {' not in app:
              types = '''type SecurityPostureCheck = {
  id: string
  category: string
  title: string
  status: 'pass' | 'warning' | 'unknown'
  severity: string
  confidence: number
  summary: string
  evidence: string
  remediation: string
}

type SecurityPostureReport = {
  platform: string
  checks: SecurityPostureCheck[]
  passed: number
  warnings: number
  unknown: number
}

'''
              app = replace_once(app, 'type VaultStatus = {\n', types + 'type VaultStatus = {\n', 'App posture types')
          if 'const [securityPosture, setSecurityPosture]' not in app:
              app = replace_once(
                  app,
                  "  const [securityMessage, setSecurityMessage] = useState('')\n",
                  "  const [securityMessage, setSecurityMessage] = useState('')\n  const [securityPosture, setSecurityPosture] = useState<SecurityPostureReport | null>(null)\n  const [securityPostureMessage, setSecurityPostureMessage] = useState('')\n",
                  'App posture state',
              )
          if 'const runSecurityPostureReview = async () =>' not in app:
              function = '''  const runSecurityPostureReview = async () => {
    setSecurityPostureMessage('Reading supported operating-system security settings locally…')
    try {
      const report = await invoke<SecurityPostureReport>('security_posture_scan')
      setSecurityPosture(report)
      setSecurityPostureMessage(report.warnings
        ? `${report.warnings} security posture warning${report.warnings === 1 ? '' : 's'} need human review.`
        : 'No warning was found in the supported readable security settings.')
    } catch (error) {
      setSecurityPostureMessage(String(error))
    }
  }

'''
              app = replace_once(app, '  useEffect(() => {\n    let disposed = false', function + '  useEffect(() => {\n    let disposed = false', 'App posture action')
          old_scope = "          <p className=\"muted\">{scanSnapshot.quickPlan.networkInterfacesSeen.toLocaleString()} network interfaces mapped · {connectedSources.length.toLocaleString()} connected review-only online sources · {availableAi.length.toLocaleString()} local AI runtimes available.</p>"
          new_scope = "          <p className=\"muted\">{scanSnapshot.quickPlan.networkInterfacesSeen.toLocaleString()} network interfaces mapped · {scanSnapshot.quickPlan.securityChecksSeen.toLocaleString()} local security settings checked · {connectedSources.length.toLocaleString()} connected review-only online sources · {availableAi.length.toLocaleString()} local AI runtimes available.</p>"
          if old_scope in app:
              app = app.replace(old_scope, new_scope, 1)

          security_marker = "      {section === 'security' && <section className=\"panel\">"
          if security_marker not in app:
              raise SystemExit('missing security section')
          before, tail = app.split(security_marker, 1)
          posture_article = '''        <div className="permission-list">
          <article>
            <div>
              <b>Operating-system security posture</b>
              <small>Read-only checks for supported firewall, login, screen-lock, endpoint-protection and legacy-protocol settings. CashPatch never changes these settings and never bypasses OS permissions.</small>
            </div>
            <button onClick={runSecurityPostureReview}>Run local posture check</button>
          </article>
        </div>
        {securityPostureMessage && <p className="status">{securityPostureMessage}</p>}
        {securityPosture && <>
          <div className="trust">
            <div><strong>{securityPosture.passed}</strong><span>supported checks passed</span></div>
            <div><strong>{securityPosture.warnings}</strong><span>warnings</span></div>
            <div><strong>{securityPosture.unknown}</strong><span>unknown / permission limited</span></div>
          </div>
          <div className="local-findings">
            {securityPosture.checks.map(item => <article className="local-finding" key={item.id}>
              <div className="local-finding-top"><span>{item.category}</span><strong>{item.status}</strong></div>
              <h3>{item.title}</h3>
              <div className="status-line"><span>Confidence</span><strong>{item.confidence}%</strong></div>
              <p>{item.summary}</p>
              <small>Evidence: {item.evidence}</small>
              <div className="local-next"><span>{item.status === 'warning' ? 'RECOMMENDED HUMAN ACTION' : 'REVIEW NOTE'}</span><b>{item.remediation}</b></div>
            </article>)}
          </div>
        </>}
'''
          if 'Operating-system security posture' not in tail:
              first_list = '        <div className="permission-list">\n'
              if first_list not in tail:
                  raise SystemExit('missing security permission list marker')
              tail = tail.replace(first_list, posture_article + first_list, 1)
          app = before + security_marker + tail
          app_path.write_text(app)

          test_path = Path('desktop/src/security-posture-contract.test.ts')
          test_path.write_text('''import { readFileSync } from 'node:fs'\nimport { fileURLToPath } from 'node:url'\nimport { describe, expect, it } from 'vitest'\n\nconst appSource = readFileSync(fileURLToPath(new URL('./App.tsx', import.meta.url)), 'utf8')\nconst rustSource = readFileSync(fileURLToPath(new URL('../src-tauri/src/security_posture.rs', import.meta.url)), 'utf8')\nconst scanSource = readFileSync(fileURLToPath(new URL('../src-tauri/src/scan.rs', import.meta.url)), 'utf8')\nconst libSource = readFileSync(fileURLToPath(new URL('../src-tauri/src/lib.rs', import.meta.url)), 'utf8')\n\ndescribe('local OS security posture contract', () => {\n  it('keeps posture inspection local and read-only', () => {\n    expect(rustSource).toContain('pub fn security_posture_scan()')\n    expect(rustSource).toContain('CashPatch will not change')\n    expect(rustSource).not.toContain('Command::new')\n    expect(rustSource).not.toContain('powershell')\n    expect(rustSource).not.toContain('osascript')\n  })\n\n  it('surfaces security warnings in full-scan findings', () => {\n    expect(scanSource).toContain('security_posture.checks.into_iter().filter')\n    expect(scanSource).toContain('security_posture:')\n    expect(scanSource).toContain('security_checks_seen')\n  })\n\n  it('registers and exposes the posture review in the dashboard', () => {\n    expect(libSource).toContain('security_posture::security_posture_scan')\n    expect(appSource).toContain("invoke<SecurityPostureReport>('security_posture_scan')")\n    expect(appSource).toContain('Operating-system security posture')\n  })\n})\n''')
          PY

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop regression tests
        working-directory: desktop
        run: npm test

      - name: Check Rust core
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Commit tested wiring and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/agent-security-posture-wiring.yml
          git config user.name "CashPatch Security Agent"
          git config user.email "actions@users.noreply.github.com"
          git add desktop/src-tauri/src/lib.rs desktop/src-tauri/src/scan.rs desktop/src/App.tsx desktop/src/security-posture-contract.test.ts .github/workflows/agent-security-posture-wiring.yml
          git commit -m "Wire local OS security posture into CashPatch scans"
          git push origin HEAD:main
