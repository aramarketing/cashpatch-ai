name: One-shot security posture wiring

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-security-posture-wiring.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Wire security posture into native scan and dashboard
        run: python3 .github/scripts/wire_security_posture.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop regression tests
        working-directory: desktop
        run: npm test

      - name: Check Rust core
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Commit tested wiring and remove one-shot agent files
        shell: bash
        run: |
          rm .github/workflows/agent-security-posture-wiring.yml
          rm .github/scripts/wire_security_posture.py
          git config user.name "CashPatch Security Agent"
          git config user.email "actions@users.noreply.github.com"
          git add desktop/src-tauri/src/lib.rs desktop/src-tauri/src/scan.rs desktop/src/App.tsx desktop/src/security-posture-contract.test.ts .github/workflows/agent-security-posture-wiring.yml .github/scripts/wire_security_posture.py
          git commit -m "Wire local OS security posture into CashPatch scans"
          git push origin HEAD:main
