name: Agent Full Scan Local AI Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-fullscan-local-ai.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire local AI into user-confirmed Full Scan
        shell: python
        run: |
          from pathlib import Path

          scan_path = Path('desktop/src-tauri/src/scan.rs')
          test_path = Path('desktop/src/local-scan-contract.test.ts')
          docs_path = Path('docs/LOCAL_AI_ARCHITECTURE.md')

          scan = scan_path.read_text()
          marker = 'Local AI advisory review:'
          if marker not in scan:
              anchor = '''fn sensitive_filename(path: &Path) -> bool {\n  let name = path\n    .file_name()\n    .and_then(|v| v.to_str())\n    .unwrap_or_default()\n    .to_ascii_lowercase();\n\n  ["password", "passwd", "credential", "credentials", "secret", "apikey", "api_key", "token"]\n    .iter()\n    .any(|needle| name.contains(needle))\n}\n\n'''
              addition = anchor + '''const MAX_LOCAL_AI_DOCUMENTS_PER_SCAN: u64 = 2_500;\n\n#[derive(Clone)]\nstruct FullScanLocalAi {\n  provider: String,\n  endpoint: Option<String>,\n  model: String,\n}\n\nfn discover_full_scan_local_ai() -> Option<FullScanLocalAi> {\n  let mut candidates = vec![\n    ("ollama".to_string(), None),\n    ("lm-studio".to_string(), None),\n  ];\n\n  if let Some(endpoint) = crate::secret_get("local-ai-jev-endpoint") {\n    candidates.push(("jev".to_string(), Some(endpoint)));\n  }\n  if let Some(endpoint) = crate::secret_get("local-ai-custom-endpoint") {\n    candidates.push(("custom-local".to_string(), Some(endpoint)));\n  }\n\n  for (provider, endpoint) in candidates {\n    let models = tauri::async_runtime::block_on(crate::local_ai::local_ai_models(\n      provider.clone(),\n      endpoint.clone(),\n    ));\n    if let Ok(models) = models {\n      if let Some(model) = models.into_iter().next() {\n        return Some(FullScanLocalAi { provider, endpoint, model: model.id });\n      }\n    }\n  }\n  None\n}\n\nfn local_ai_review_document(\n  local_ai: &FullScanLocalAi,\n  path: &Path,\n  text: String,\n) -> Vec<LocalFinding> {\n  let task = format!(\n    "Review this user-approved local business document for contradictions, unresolved obligations, duplicate or suspicious costs, contract or invoice anomalies, security concerns and efficiency risks. Source path: {}. Do not execute or recommend autonomous changes.",\n    path.display()\n  );\n  let analysis = tauri::async_runtime::block_on(crate::local_ai::local_ai_analyze_text(\n    local_ai.provider.clone(),\n    local_ai.endpoint.clone(),\n    local_ai.model.clone(),\n    text,\n    Some(task),\n    true,\n  ));\n  let Ok(analysis) = analysis else { return Vec::new(); };\n\n  analysis.findings.into_iter().map(|finding| LocalFinding {\n    id: Uuid::new_v4().to_string(),\n    category: format!("local_ai_review:{}", finding.category),\n    severity: finding.severity,\n    title: format!("Local AI advisory: {}", finding.title),\n    summary: format!(\n      "Local-only {} model {} flagged this for human verification. {}",\n      analysis.provider, analysis.model, finding.summary\n    ),\n    evidence: format!("{} :: {}", path.display(), finding.evidence),\n    remediation: format!(\n      "Review the source manually. {} CashPatch will not execute, edit, send, delete, pay or otherwise change anything.",\n      finding.remediation\n    ),\n  }).collect()\n}\n\n'''
              if anchor not in scan:
                  raise SystemExit('sensitive filename anchor missing')
              scan = scan.replace(anchor, addition, 1)

              anchor = '''    let mut reported_invoice_numbers = HashSet::<String>::new();\n    let mut findings = Vec::<LocalFinding>::new();\n\n    for root in &roots {\n'''
              replacement = '''    let mut reported_invoice_numbers = HashSet::<String>::new();\n    let mut findings = Vec::<LocalFinding>::new();\n    let local_ai = discover_full_scan_local_ai();\n    let mut local_ai_documents_reviewed = 0_u64;\n\n    if let Some(ai) = &local_ai {\n      if let Ok(mut state) = runtime().lock() {\n        state.snapshot.current_item = Some(format!("Local AI ready: {} · {}", ai.provider, ai.model));\n      }\n      emit_snapshot(&app);\n    }\n\n    for root in &roots {\n'''
              if anchor not in scan:
                  raise SystemExit('full scan local state anchor missing')
              scan = scan.replace(anchor, replacement, 1)

              anchor = '''              if business_extension(path) && len > 0 && len <= CONTENT_HASH_MAX_BYTES {\n'''
              addition = '''              if business_extension(path)\n                && !sensitive_filename(path)\n                && local_ai_documents_reviewed < MAX_LOCAL_AI_DOCUMENTS_PER_SCAN\n              {\n                if let (Some(ai), Ok(Some(text))) =\n                  (local_ai.as_ref(), document_analysis::extract_document_text(path, len))\n                {\n                  if !text.trim().is_empty() {\n                    local_ai_documents_reviewed = local_ai_documents_reviewed.saturating_add(1);\n                    if let Ok(mut state) = runtime().lock() {\n                      state.snapshot.current_item = Some(format!("Local AI advisory review: {}", path.display()));\n                    }\n                    emit_snapshot(&app);\n                    findings.extend(local_ai_review_document(ai, path, text));\n                  }\n                }\n              }\n\n''' + anchor
              if anchor not in scan:
                  raise SystemExit('content hash anchor missing')
              scan = scan.replace(anchor, addition, 1)
              scan_path.write_text(scan)

          test = test_path.read_text()
          if "uses the shared loopback-only local AI router during Full Scan" not in test:
              anchor = '''  it('surfaces crash-safe recovery and local scan history without automatic resume', () => {\n'''
              addition = '''  it('uses the shared loopback-only local AI router during Full Scan', () => {\n    const scan = readRepoFile('desktop/src-tauri/src/scan.rs')\n    const localAi = readRepoFile('desktop/src-tauri/src/local_ai.rs')\n    const backend = readRepoFile('desktop/src-tauri/src/lib.rs')\n\n    expect(backend).toContain('mod local_ai;')\n    expect(scan).toContain('discover_full_scan_local_ai()')\n    expect(scan).toContain('crate::local_ai::local_ai_models')\n    expect(scan).toContain('crate::local_ai::local_ai_analyze_text')\n    expect(scan).toContain('document_analysis::extract_document_text(path, len)')\n    expect(scan).toContain('Local AI advisory review:')\n    expect(scan).toContain('!sensitive_filename(path)')\n    expect(localAi).toContain('egress::allow_local_ai')\n    expect(localAi).toContain('normalize_base_endpoint')\n  })\n\n'''
              if anchor not in test:
                  raise SystemExit('test insertion anchor missing')
              test = test.replace(anchor, addition + anchor, 1)
              test_path.write_text(test)

          docs = docs_path.read_text()
          note = '''\n### Full Scan semantic review implementation\n\nThe confirmed Full Scan now discovers the first available local-only runtime (Ollama, LM Studio, configured Jev, then configured custom local endpoint) once per scan and may enrich supported business-document findings locally. Sensitive credential-named files are deliberately excluded from model review. The deterministic scan remains authoritative, model findings are advisory and evidence-bounded, and no cloud fallback exists. A per-scan document ceiling protects CPU/RAM/IO on very large estates while deterministic collection continues across the approved scope.\n'''
          if '### Full Scan semantic review implementation' not in docs:
              docs += note
              docs_path.write_text(docs)

      - name: Validate desktop tests
        working-directory: desktop
        run: |
          npm install
          npm test

      - name: Commit integration
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "CashPatch Agent"
          git config user.email "61079904+aramarketing@users.noreply.github.com"
          git add desktop/src-tauri/src/scan.rs desktop/src/local-scan-contract.test.ts docs/LOCAL_AI_ARCHITECTURE.md
          git commit -m "Use local AI during confirmed Full Scan"
          git push origin main
