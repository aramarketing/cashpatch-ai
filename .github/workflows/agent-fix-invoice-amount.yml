name: Agent Fix Invoice Amount Parsing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-fix-invoice-amount.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix thousands/decimal separator parsing
        shell: python
        run: |
          from pathlib import Path
          p = Path('desktop/src-tauri/src/document_analysis.rs')
          s = p.read_text()
          old = r'''r"(?i)(?:gesamtbetrag|rechnungsbetrag|zu\s+zahlen|summe|total|amount\s+due)\s*[:=-]?\s*(?:eur|€)?\s*([0-9][0-9.\s']*(?:,[0-9]{2}|\.[0-9]{2}))\s*(?:eur|€)?"'''
          new = r'''r"(?i)(?:gesamtbetrag|rechnungsbetrag|zu\s+zahlen|summe|total|amount\s+due)\s*[:=-]?\s*(?:eur|€)?\s*([0-9][0-9., ']*[.,][0-9]{2})\s*(?:eur|€)?"'''
          if new not in s:
              if old not in s:
                  raise SystemExit('amount regex anchor missing')
              s = s.replace(old, new, 1)
              p.write_text(s)

      - name: Validate locale-aware amount semantics without desktop GUI dependencies
        shell: python
        run: |
          import re
          from pathlib import Path

          source = Path('desktop/src-tauri/src/document_analysis.rs').read_text()
          expected = r'''r"(?i)(?:gesamtbetrag|rechnungsbetrag|zu\s+zahlen|summe|total|amount\s+due)\s*[:=-]?\s*(?:eur|€)?\s*([0-9][0-9., ']*[.,][0-9]{2})\s*(?:eur|€)?"'''
          if expected not in source:
              raise SystemExit('updated Rust amount regex is not present')

          pattern = re.compile(r"(?i)(?:gesamtbetrag|rechnungsbetrag|zu\s+zahlen|summe|total|amount\s+due)\s*[:=-]?\s*(?:eur|€)?\s*([0-9][0-9., ']*[.,][0-9]{2})\s*(?:eur|€)?")
          cases = {
              'Gesamtbetrag: 1.234,56 EUR': '1.234,56',
              'Amount due: EUR 1,249.90': '1,249.90',
              'Total: 99.90 EUR': '99.90',
              'Summe: 99,90 €': '99,90',
          }
          for text, wanted in cases.items():
              match = pattern.search(text)
              if not match or match.group(1) != wanted:
                  raise SystemExit(f'amount regex failed for {text!r}: {match.group(1) if match else None!r}')

      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/agent-fix-invoice-amount.yml
          git diff --check
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "CashPatch Agent"
          git config user.email "61079904+aramarketing@users.noreply.github.com"
          git add -A
          git commit -m "Fix locale-aware invoice amount extraction"
          git push origin main
